---
name: Linting

on:
  push:
  pull_request:

jobs:
  build:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full git history is needed to get a proper list of changed files
          # within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_NATURAL_LANGUAGE: false
          DEFAULT_BRANCH: main
          # Pinned to the linter set super-linter ran before v8. The v8 upgrade
          # turned on additional linters; they are disabled here so the version
          # bump does not silently change what CI enforces. Re-enable and fix
          # them deliberately, one at a time.
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
